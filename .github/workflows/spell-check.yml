name: Spell Check

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Repository slug (user/repo)"
        required: true
        type: string

jobs:
  spellcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - name: Clone repository
        id: repo
        run: |
          trimmed=$(echo "${{ github.event.inputs.repository }}" | sed 's:/*$::')
          echo "repo=$(gh repo view --json nameWithOwner --jq '.nameWithOwner' ${trimmed})" >> "$GITHUB_OUTPUT"
          gh repo view  --json nameWithOwner --jq '.nameWithOwner' ${trimmed} 
          gh repo clone "${{ github.event.inputs.repository }}" target-repo
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Check spelling with codespell
        working-directory: target-repo
        run: |
          echo "# [${{ github.event.inputs.repository }}](${{ github.event.inputs.repository }})" >> "${GITHUB_STEP_SUMMARY}"
          #find . -type f -regextype posix-egrep -regex ".*\.(mdx|md|txt)$" -exec yes "0" | uvx codespell -i 2 -w {} +
          find . -type f -regextype posix-egrep -regex ".*\.(mdx|md|txt)$" -exec sh -c 'yes "0" | uvx codespell -i 2 -w "$@"' sh {} +

      - name: Run cspell on markdown files
        id: cspell
        working-directory: target-repo
        run: |
            echo "found_issues=true" >> "$GITHUB_OUTPUT"
     
      - name: Setup credentials to access private repositories
        run: |
          git config --global user.name "${{github.repository_owner}}"
          git config --global user.email "$(gh api user/public_emails -q '.[0].email')"
          git config --global url.https://${{ secrets.GH_PAT }}@github.com/.insteadOf https://github.com/

      - name: Fork repository
        if: steps.cspell.outputs.found_issues == 'true'
        working-directory: target-repo
        run: |
          gh repo fork "${{ steps.repo.outputs.repo }}" --clone=false --remote=true
          git remote set-url origin "https://github.com/${{ steps.repo.outputs.repo }}.git"

      - name: Commit and push changes
        if: steps.cspell.outputs.found_issues == 'true'
        working-directory: target-repo
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changed files to commit"
          else
            git commit -m "docs: correct spelling"
            git push origin HEAD
          fi
