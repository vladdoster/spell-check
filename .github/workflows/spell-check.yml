name: Spell Check

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Repository slug (user/repo)"
        required: true
        type: string
      ignore:
        description: "Space-separated list of words to ignore"
        required: false
        type: string
      skip:
        description: "Comma-separated list of files to skip"
        required: false
        type: string

run-name: ${{ inputs.repository }}

jobs:
  spellcheck:
    runs-on: ubuntu-latest
    outputs:
      repoFork: ${{ steps.spell.outputs.repoFork }}
      repoForkUrl: ${{ steps.spell.outputs.repoForkUrl }}
    steps:
      - name: Checkout action
        uses: actions/checkout@v5

      - name: Run codespell fixer
        id: spell
        uses: ./
        with:
          repository: ${{ inputs.repository }}
          ignore: ${{ inputs.ignore }}
          skip: ${{ inputs.skip }}
          github-token: ${{ secrets.GH_PAT }}

  deleteFork:
    name: Cleanup
    runs-on: ubuntu-latest
    environment: Delete fork
    needs: spellcheck
    steps:
      - name: Checkout action
        uses: actions/checkout@v5

      - name: Delete ${{ needs.spellcheck.outputs.repoFork }} fork
        uses: ./
        with:
          repository: ${{ needs.spellcheck.outputs.repoFork }}
          delete-fork: "true"
          github-token: ${{ secrets.GH_PAT }}
