name: Spell Check

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Repository slug (user/repo)"
        required: true
        type: string
      ignore:
        description: "Space-separated list of words to ignore"
        required: false
        type: string
      skip:
        description: "Comma-separated list of files to skip"
        required: false
        type: string
      dry-run:
        description: "Report fixes without forking or pushing"
        required: false
        type: boolean
        default: false

run-name: ${{ inputs.repository }}

jobs:
  spellcheck:
    runs-on: ubuntu-latest
    outputs:
      repoFork: ${{ steps.spell.outputs.repoFork }}
      repoForkUrl: ${{ steps.spell.outputs.repoForkUrl }}
    steps:
      - name: Checkout action
        uses: actions/checkout@v5

      # The runs API does not expose workflow_dispatch inputs, so Re-run reads them
      # from this cache entry, keyed by run ID. Written before the fixer runs so a
      # failed run is still re-runnable.
      - name: Record inputs
        env:
          IN_REPOSITORY: ${{ inputs.repository }}
          IN_IGNORE: ${{ inputs.ignore }}
          IN_SKIP: ${{ inputs.skip }}
          IN_DRY_RUN: ${{ inputs.dry-run }}
        run: |
          jq -n \
            --arg repository "${IN_REPOSITORY}" \
            --arg ignore "${IN_IGNORE}" \
            --arg skip "${IN_SKIP}" \
            --arg dry_run "${IN_DRY_RUN}" \
            '{repository: $repository, ignore: $ignore, skip: $skip, "dry-run": $dry_run}' \
            >"${RUNNER_TEMP}/inputs.json"

      - name: Cache inputs for re-run
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/inputs.json
          key: spellcheck-inputs-${{ github.run_id }}

      - name: Run codespell fixer
        id: spell
        uses: ./
        with:
          repository: ${{ inputs.repository }}
          ignore: ${{ inputs.ignore }}
          skip: ${{ inputs.skip }}
          dry-run: ${{ inputs.dry-run }}
          github-token: ${{ secrets.GH_PAT }}

  deleteFork:
    name: Cleanup
    runs-on: ubuntu-latest
    environment: Delete fork
    needs: spellcheck
    # A dry run never creates a fork, so there is nothing to clean up.
    if: ${{ !inputs.dry-run }}
    steps:
      - name: Checkout action
        uses: actions/checkout@v5

      - name: Delete ${{ needs.spellcheck.outputs.repoFork }} fork
        uses: ./
        with:
          repository: ${{ needs.spellcheck.outputs.repoFork }}
          delete-fork: "true"
          github-token: ${{ secrets.GH_PAT }}
