name: Re-run

on:
  workflow_dispatch:
    inputs:
      use-previous:
        description: "Re-use the most recent Spell Check run"
        required: false
        type: boolean
        default: false
      workflow-run:
        description: "Spell Check run ID or run number to re-use"
        required: false
        type: string
      repository:
        description: "Repository slug (user/repo); ignored when a previous run resolves"
        required: false
        type: string
      ignore:
        description: "Space-separated list of words to ignore"
        required: false
        type: string
      skip:
        description: "Comma-separated list of files to skip"
        required: false
        type: string
      dry-run:
        description: "Report fixes without forking or pushing"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      use-previous:
        required: false
        type: boolean
        default: false
      workflow-run:
        required: false
        type: string
      repository:
        required: false
        type: string
      ignore:
        required: false
        type: string
      skip:
        required: false
        type: string
      dry-run:
        required: false
        type: boolean
        default: false
    secrets:
      GH_PAT:
        required: true

run-name: re-run ${{ inputs.workflow-run && format('#{0}', inputs.workflow-run) || (inputs.use-previous && 'latest spell-check' || inputs.repository) }}

jobs:
  # Split from the dispatch job so that job's name can interpolate needs.* — a job
  # name is evaluated when the job is scheduled, unlike run-name which is fixed
  # before any job runs and so cannot see the resolved repository or run number.
  resolve:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      label: ${{ steps.merge.outputs.label }}
      repository: ${{ steps.merge.outputs.repository }}
      skip: ${{ steps.merge.outputs.skip }}
      ignore: ${{ steps.merge.outputs.ignore }}
    env:
      # A workflow_dispatch made with GITHUB_TOKEN silently creates no run, so every
      # gh call here uses the PAT.
      GH_TOKEN: ${{ secrets.GH_PAT }}
      # No checkout runs here, so gh cannot infer the repo from git context.
      GH_REPO: ${{ github.repository }}
      TARGET_WORKFLOW: spell-check.yml
      USE_PREVIOUS: ${{ inputs.use-previous }}
      WORKFLOW_RUN: ${{ inputs.workflow-run }}
      IN_REPOSITORY: ${{ inputs.repository }}
      IN_SKIP: ${{ inputs.skip }}
      IN_IGNORE: ${{ inputs.ignore }}
    steps:
      - name: Resolve previous run
        id: prev
        run: |
          set -eu
          prev="" number=""
          if [ -n "${WORKFLOW_RUN}" ]; then
            case "${WORKFLOW_RUN}" in
              '' | *[!0-9]*)
                echo "::error ::workflow-run must be a positive integer, got '${WORKFLOW_RUN}'"
                exit 1
                ;;
            esac
            # Run IDs are ~11 digits and appear in run URLs; run numbers are small
            # per-workflow counters. Disambiguate by magnitude.
            if [ "${WORKFLOW_RUN}" -gt 1000000 ]; then
              prev="${WORKFLOW_RUN}"
            else
              prev=$(gh run list --workflow="${TARGET_WORKFLOW}" --limit 100 \
                --json databaseId,number \
                -q "[.[] | select(.number == ${WORKFLOW_RUN})] | first | .databaseId // empty")
              [ -n "${prev}" ] || {
                echo "::error ::No ${TARGET_WORKFLOW} run number ${WORKFLOW_RUN} in the last 100 runs"
                exit 1
              }
            fi
          elif [ "${USE_PREVIOUS}" = "true" ]; then
            prev=$(gh run list --workflow="${TARGET_WORKFLOW}" --limit 1 \
              --json databaseId -q '.[0].databaseId // empty')
            [ -n "${prev}" ] || {
              echo "::error ::use-previous is set but no ${TARGET_WORKFLOW} run exists"
              exit 1
            }
          fi
          # The run number is what the Actions UI shows as #N, so it is the useful
          # half of the identity in a job label.
          [ -n "${prev}" ] && number=$(gh run view "${prev}" --json number -q '.number // empty')
          {
            echo "id=${prev}"
            echo "number=${number}"
          } >>"${GITHUB_OUTPUT}"
          echo "::notice ::Previous run: ${prev:-<none>}${number:+ (#${number})}"

      - name: Read previous run inputs
        id: read
        env:
          PREV: ${{ steps.prev.outputs.id }}
        run: |
          set -eu
          repository="" skip="" ignore="" source="none"
          if [ -n "${PREV}" ]; then
            # A miss means the artifact expired (30-day retention) or the run predates
            # it. Downloading here rather than via actions/download-artifact keeps a
            # miss from posting a spurious failure annotation.
            gh run download "${PREV}" -n spellcheck-inputs -D "${RUNNER_TEMP}" 2>/dev/null || true
            if [ -f "${RUNNER_TEMP}/inputs.json" ]; then
              repository=$(jq -r '.repository // ""' "${RUNNER_TEMP}/inputs.json")
              ignore=$(jq -r '.ignore // ""' "${RUNNER_TEMP}/inputs.json")
              skip=$(jq -r '.skip // ""' "${RUNNER_TEMP}/inputs.json")
              source="artifact"
            else
              # Artifacts are retained 30 days. run-name still carries the repository,
              # so degrade to that rather than failing.
              repository=$(gh run view "${PREV}" --json displayTitle -q '.displayTitle // empty')
              source="run title (no artifact)"
              echo "::warning ::No inputs artifact for run ${PREV}; skip/ignore not recovered"
            fi
          fi
          echo "::notice ::Retrieved from ${source}: repository=${repository:-<none>} skip=${skip:-<none>} ignore=${ignore:-<none>}"
          {
            echo "repository=${repository}"
            echo "skip=${skip}"
            echo "ignore=${ignore}"
          } >>"${GITHUB_OUTPUT}"

      - name: Combine inputs
        id: merge
        env:
          PREV_REPOSITORY: ${{ steps.read.outputs.repository }}
          PREV_SKIP: ${{ steps.read.outputs.skip }}
          PREV_IGNORE: ${{ steps.read.outputs.ignore }}
          PREV_NUMBER: ${{ steps.prev.outputs.number }}
        run: |
          set -eu
          # Union of previous and new values, previous first, order-preserving dedup.
          # action.yml defines ignore as space-separated and skip as comma-separated,
          # so the separator differs per field and must not be unified.
          merge() {
            printf '%s%s%s' "$2" "$1" "$3" | tr "$1" '\n' | grep -v '^$' | awk '!seen[$0]++' | paste -sd"$1" -
          }
          repository="${PREV_REPOSITORY:-${IN_REPOSITORY}}"
          [ -n "${repository}" ] || {
            echo "::error ::repository is required when no previous run is selected"
            exit 1
          }
          # repository may arrive as a slug or a full URL; the label wants owner/name.
          repoName="${repository#https://github.com/}"
          repoName="${repoName%.git}"
          repoName="${repoName%/}"
          {
            echo "repository=${repository}"
            echo "label=${repoName}${PREV_NUMBER:+ #${PREV_NUMBER}}"
            echo "skip=$(merge ',' "${PREV_SKIP}" "${IN_SKIP}")"
            echo "ignore=$(merge ' ' "${PREV_IGNORE}" "${IN_IGNORE}")"
          } >>"${GITHUB_OUTPUT}"

  dispatch:
    needs: resolve
    name: re-run ${{ needs.resolve.outputs.label }}
    runs-on: ubuntu-latest
    permissions: {}
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
      GH_REPO: ${{ github.repository }}
      TARGET_WORKFLOW: spell-check.yml
      DRY_RUN: ${{ inputs.dry-run }}
      REPOSITORY: ${{ needs.resolve.outputs.repository }}
      SKIP: ${{ needs.resolve.outputs.skip }}
      IGNORE: ${{ needs.resolve.outputs.ignore }}
    steps:
      - name: Dispatch Spell Check
        id: dispatch
        run: |
          set -eu
          latest() {
            gh run list --workflow="${TARGET_WORKFLOW}" --limit 1 --json databaseId -q '.[0].databaseId // 0'
          }
          before=$(latest)
          gh workflow run "${TARGET_WORKFLOW}" \
            -f repository="${REPOSITORY}" \
            -f skip="${SKIP}" \
            -f ignore="${IGNORE}" \
            -f dry-run="${DRY_RUN}"
          # The dispatch API returns 204 with no body, so poll for a run newer than
          # the pre-dispatch baseline.
          new="${before}"
          i=0
          while [ "${i}" -lt 30 ]; do
            new=$(latest)
            [ "${new}" != "${before}" ] && break
            sleep 2
            i=$((i + 1))
          done
          if [ "${new}" = "${before}" ]; then
            echo "::error ::Dispatched ${TARGET_WORKFLOW} but no new run appeared; check that GH_PAT is set"
            exit 1
          fi
          echo "id=${new}" >>"${GITHUB_OUTPUT}"

      - name: Annotate dispatched run
        env:
          NEW: ${{ steps.dispatch.outputs.id }}
        run: |
          set -eu
          run=$(gh run view "${NEW}" --json workflowName,status,conclusion,url,createdAt)
          name=$(printf '%s' "${run}" | jq -r .workflowName)
          url=$(printf '%s' "${run}" | jq -r .url)
          created=$(printf '%s' "${run}" | jq -r .createdAt)
          # A run still in flight has an empty conclusion; report its status instead.
          state=$(printf '%s' "${run}" | jq -r 'if .conclusion == "" or .conclusion == null then .status else .conclusion end')
          case "${state}" in
            success) color=green ;;
            failure | cancelled | timed_out | startup_failure) color=red ;;
            *) color=orange ;;
          esac
          when=$(date -u -d "${created}" '+%Y-%m-%d %H:%M UTC')
          {
            echo '| Workflow | Status | Run | Created |'
            echo '|---|---|---|---|'
            # shellcheck disable=SC2016  # the $ are MathJax delimiters, not shell expansions
            printf '| $\\textcolor{cyan}{\\texttt{%s}}$ | $\\textcolor{%s}{\\texttt{%s}}$ | [`%s`](%s) | `%s` |\n' \
              "${name}" "${color}" "${state}" "${NEW}" "${url}" "${when}"
          } >>"${GITHUB_STEP_SUMMARY}"
          echo "::notice ::${name} ${state} ${url} ${when}"
