name: Base Image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.base
      - .github/workflows/base-image.yml
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No layer cache, because a cached layer would keep an old gh release
      # across weekly rebuilds.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.base
          platforms: linux/amd64,linux/arm64
          # A dispatch on another branch builds both platforms as a test but publishes nothing.
          push: ${{ github.ref == 'refs/heads/main' }}
          # Weekly rebuilds reuse main's SHA, so the run ID is the unique rollback tag.
          tags: |
            ghcr.io/${{ github.repository }}-base:latest
            ghcr.io/${{ github.repository }}-base:run-${{ github.run_id }}
